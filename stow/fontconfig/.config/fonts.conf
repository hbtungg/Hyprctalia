<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="font">
    <!-- 1. Bật Antialiasing (Khử răng cưa) -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- 2. Bật Subpixel RGB (Bắt buộc cho màn LCD 24") -->
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>

    <!-- 3. Hinting nhẹ để căn viền chữ vào Pixel Grid mà không làm biến dạng font -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>

    <!-- 4. Lọc dải màu Subpixel giúp nét chữ mịn và đậm đà hơn -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
